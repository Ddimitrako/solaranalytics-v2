version: '3.1'

services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env/prod/.env_frontend
  db:
    image: postgres:16
    volumes:
      - ../sa_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    env_file:
      - .env/prod/.env_db
  backend:
    hostname: backend
    container_name: backend
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000


    env_file:
      - .env/prod/.env_backend
